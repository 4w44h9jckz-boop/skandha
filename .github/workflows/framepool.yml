name: Frame pool conformance (emem vectors)

on:
  push:
    paths:
      - "packages/framepool/**"
      - ".github/workflows/framepool.yml"
  pull_request:
    paths:
      - "packages/framepool/**"
      - ".github/workflows/framepool.yml"

jobs:
  framepool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install

      - name: Types, lint, vectors
        working-directory: packages/framepool
        run: |
          bun run check-types
          bun run lint
          bun run test
          bun run vectors
